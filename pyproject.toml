[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling>=1.27",
]

[project]
name = "linkotron"
description = "CLI to format links"
readme = "README.md"
keywords = [
  "link",
  "markdown",
  "md",
  "restructuredtext",
  "rst",
]
license = "MIT"
license-files = [ "LICENSE.txt" ]
authors = [ { name = "Hugo van Kemenade" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = [ "version" ]
dependencies = [
  "pyperclip; platform_system=='Darwin'",
  "pyperclip; platform_system=='Windows'",
]
optional-dependencies.tests = [
  "pytest>=9",
  "pytest-cov",
]
urls."Issue tracker" = "https://github.com/hugovk/linkotron/issues"
urls."Release notes" = "https://github.com/hugovk/linkotron/releases"
urls.Changelog = "https://github.com/hugovk/linkotron/releases"
urls.Homepage = "https://github.com/hugovk/linkotron"
urls.Source = "https://github.com/hugovk/linkotron"
scripts.linkotron = "linkotron.cli:main"
scripts.linky = "linkotron.cli:main"

[tool.hatch]
version.source = "vcs"
version.raw-options.local_scheme = "no-local-version"
build.hooks.vcs.version-file = "src/linkotron/_version.py"

[tool.ruff]
fix = true
lint.extend-select = [
  "C4",     # flake8-comprehensions
  "E",      # pycodestyle errors
  "EM",     # flake8-errmsg
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PT",     # flake8-pytest-style
  "PYI",    # flake8-pyi
  "TC",     # flake8-type-checking
  "TID251", # flake8-tidy-imports: banned-api
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
]
lint.ignore = [
  "E203",   # Whitespace before ':'
  "E221",   # Multiple spaces before operator
  "E226",   # Missing whitespace around arithmetic operator
  "E241",   # Multiple spaces after ','
  "PIE790", # flake8-pie: unnecessary-placeholder
]
lint.flake8-import-conventions.aliases.datetime = "dt"
lint.flake8-import-conventions.banned-from = [ "datetime" ]
lint.flake8-pytest-style.parametrize-names-type = "csv"
lint.flake8-tidy-imports.banned-api."re.match".msg = "use re.fullmatch() or re.search() instead"
lint.flake8-tidy-imports.banned-api."typing.TYPE_CHECKING".msg = "use TYPE_CHECKING = False instead"
lint.isort.known-first-party = [ "linkotron" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.future-annotations = true

[tool.pyproject-fmt]
max_supported_python = "3.16"

[tool.mypy]
strict = true
pretty = true
num_workers = 4
show_error_codes = true

[tool.pytest]
addopts = [ "--color=yes" ]
filterwarnings = [
  "error",
]
minversion = "9.0"
testpaths = [ "tests" ]

[tool.coverage]
run.omit = [
  "**/__main__.py",
  "**/cli.py",
  "**/scripts/*",
]
run.disable_warnings = [ "no-sysmon" ]  # 3.11
run.core = "sysmon"  # default for 3.14+, available for 3.12+
# Regexes for lines to exclude from consideration
report.exclude_also = [
  # Don't complain if non-runnable code isn't run:
  "if __name__ == .__main__.:",
  "return NotImplemented",
]
